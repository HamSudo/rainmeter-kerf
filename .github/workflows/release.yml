name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      

      - run: pip install luaparser

      - run: python tools/check.py

      - run: python tools/build-rmskin.py ${{ steps.version.outputs.version }}
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          path: dist/Kerf-${{ steps.version.outputs.version }}.rmskin
          archive: false
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Kerf-${{ needs.build.outputs.version }}.rmskin

      - run: gh release create "$GITHUB_REF_NAME" Kerf-*.rmskin \
             --title "Kerf ${{ needs.build.outputs.version }}" \
             --generate-notes \
             $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
  