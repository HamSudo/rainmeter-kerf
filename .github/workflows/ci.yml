# CI: prove every change still checks out and builds on a clean machine.
name: CI

on:
  push:
    branches: [main]      # every push to main
  pull_request:           # and every pull request, before it is merged
  workflow_dispatch:      # plus a "Run workflow" button on the Actions tab

permissions:
  contents: read          # CI only reads the code

jobs:
  build:
    runs-on: windows-latest   # the helper compiles with the .NET Framework csc that Windows ships

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the Lua parser
        run: pip install luaparser

      - name: Check the skin
        run: python tools/check.py

      - name: Build the .rmskin
        run: python tools/build-rmskin.py ci-${{ github.run_number }}

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: Kerf-ci-${{ github.run_number }}
          path: dist/*.rmskin
          retention-days: 14
