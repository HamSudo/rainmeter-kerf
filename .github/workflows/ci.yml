name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'


      - run: pip install luaparser

      - run: python tools/check.py

      - run: python tools/build-rmskin.py ci-${{ github.run_number }}

      - uses: actions/upload-artifact@v7
        with:
          path: dist/Kerf-ci-${{ github.run_number }}.rmskin
          archive: false
          retention-days: 7