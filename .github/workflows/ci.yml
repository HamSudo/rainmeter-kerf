name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        
      
      - run: pip install luaparser

      - run: python tools/check.py

      - run: python tools/build-rmskin.py ci-${{ github.run_number }}

      - run: actions/upload-artifact@v4
        with:
          name: Kerf-ci-${{ github.run_number }}
          path: dist/*.rmskin
          retention-days: 14