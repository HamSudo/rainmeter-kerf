[Rainmeter]
Update=-1
AccurateText=1
OnRefreshAction=[!ZPos 0]

[Metadata]
Name=Kerf - Customize
Information=Settings panel for Kerf. Open it from any Kerf module's right-click menu > Customize Kerf.
Version=1.1

[Variables]
@Include=#@#Variables.inc
@IncludeModules=#@#Modules.inc
@IncludeTheme=#@#PanelTheme#PanelTheme#.inc
W=440
H=772
C2=224

[mSet]
Measure=Script
ScriptFile=#@#Scripts\Settings.lua

[mInput]
Measure=Plugin
Plugin=InputText
SolidColor=#PInputBg#
FontColor=#PText#
FontFace=JetBrains Mono
FontSize=8.5
StringAlign=Left
InputNumber=1
FocusDismiss=1
X=0
Y=0
W=40
H=20
Command1=[!CommandMeasure mSet "Typed('$UserInput$')"]

[sLabel]
FontFace=JetBrains Mono
FontSize=7
FontColor=#PLabel#
StringCase=Upper
InlineSetting=CharacterSpacing | 0 | 1.5 | 0
AntiAlias=1

[sBtn]
FontFace=Hanken Grotesk
FontSize=8.5
FontWeight=500
FontColor=#PBtnFg#
SolidColor=#PBtnBg#
Padding=10,6,10,6
AntiAlias=1
X=4R
Y=r

[sVal]
FontFace=JetBrains Mono
FontSize=8.5
FontColor=#PText#
Padding=10,6,10,6
W=36
AntiAlias=1
X=4R
Y=r

[sSw]
X=8R
Y=r

[Bg]
