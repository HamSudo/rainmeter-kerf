[Rainmeter]
Update=-1
AccurateText=1
OnRefreshAction=[!ZPos 1]

[Metadata]
Name=Kerf - Customize
Information=Settings panel for Kerf. Open it from any Kerf module's right-click menu > Customize Kerf.
Version=1.1

[Variables]
@Include=#@#Variables.inc
@IncludeModules=#@#Modules.inc
W=440
H=604
C2=224

[mSet]
Measure=Script
ScriptFile=#@#Scripts\Settings.lua

[sLabel]
FontFace=JetBrains Mono
FontSize=7
FontColor=150,158,166,255
StringCase=Upper
InlineSetting=CharacterSpacing | 0 | 1.5 | 0
AntiAlias=1

[sBtn]
FontFace=Hanken Grotesk
FontSize=8.5
FontWeight=500
FontColor=214,220,226,235
SolidColor=255,255,255,16
Padding=10,6,10,6
AntiAlias=1
X=4R
Y=r

[sVal]
FontFace=JetBrains Mono
FontSize=8.5
FontColor=236,240,243,255
Padding=10,6,10,6
W=36
AntiAlias=1
X=4R
Y=r

[sSw]
X=8R
Y=r

[Bg]
