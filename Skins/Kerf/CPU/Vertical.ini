[Rainmeter]
Update=2000
@Include=#@#Menu.inc

[Metadata]
Name=Kerf - CPU (Vertical)
Information=CPU temperature, vertical: label one letter per line, temperature, vertical scale. Native Windows sensors.
Version=1.3

[Variables]
@Include=#@#Variables.inc
@IncludeModules=#@#Modules.inc
Size=#CPUSize#
Trans=#CPUTrans#
Hover=#CPUHover#
Scale=(((#DisplayMode# = 0) ? #CPUAutoScale# : #BaseScale#)*#Size#/100)
AlignMode=#CPUAlign#
Kind=CPU
Label=CPU
ColX=(10*#Scale#)
RH=([MeterUnit:Y] + [MeterUnit:H])
@Include2=#@#Styles.inc
@Include3=#@#Ink.inc
@Include4=#@#Align.inc
@IncludeHover=#@#Hover.inc
@Include5=#@#TempData.inc
@Include6=#@#TempVertical.inc
