[Rainmeter]
Update=2000
@Include=#@#Menu.inc

[Metadata]
Name=Kerf - CPU
Information=CPU temperature from native Windows sensors (no extra software).
Version=1.1

[Variables]
@Include=#@#Variables.inc
@IncludeModules=#@#Modules.inc
Size=#CPUSize#
Trans=#CPUTrans#
Hover=#CPUHover#
Scale=(#BaseScale#*#Size#/100)
AlignMode=0
Kind=CPU
Label=CPU
RowW=([MeterLblRef:W] + 10*#Scale# + [MeterValRef:W])
@Include2=#@#Styles.inc
@Include3=#@#Ink.inc
@Include4=#@#Align.inc
@IncludeHover=#@#Hover.inc
@Include5=#@#Temp.inc
