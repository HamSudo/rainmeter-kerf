[Rainmeter]
Update=2000
@Include=#@#Menu.inc

[Metadata]
Name=Kerf - CPU (Gauge)
Information=CPU temperature as a ring gauge that fills and warms in colour with the temperature. Native Windows sensors.
Version=1.0

[Variables]
@Include=#@#Variables.inc
@IncludeModules=#@#Modules.inc
Size=#CPUSize#
Trans=#CPUTrans#
Hover=#CPUHover#
Scale=(((#DisplayMode# = 0) ? #CPUAutoScale# : #BaseScale#)*#Size#/100)
AlignMode=#CPUAlign#
Kind=CPU
Label=CPU
GD=(64*#Scale#)
GC=(32*#Scale#)
GR=(27*#Scale#)
GS=(3.5*#Scale#)
Heat=110,214,140
@Include2=#@#Styles.inc
@Include3=#@#Ink.inc
@Include4=#@#Align.inc
@IncludeHover=#@#Hover.inc
@Include5=#@#TempData.inc
@Include6=#@#TempGauge.inc
