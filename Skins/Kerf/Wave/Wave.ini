ScriptFile=#@#Scripts\Wave.lua
Bands=24

[MeterBox]
MeterStyle=sHitBox
W=(#WaveWidth#*#Scale#)
H=(#WaveHeight#*#Scale#)

[MeterWave]
Meter=Shape
DynamicVariables=1
X=0
Y=0
WavePath=0,(#WaveHeight#*#Scale#/2) | LineTo (#WaveWidth#*#Scale#),(#WaveHeight#*#Scale#/2)
Shape=Path WavePath | StrokeWidth (#WaveStroke#*#Scale#) | Stroke Color #Ink#,184 | Fill Color 0,0,0,0 | StrokeLineJoin Round | StrokeStartCap Round | StrokeEndCap Round
