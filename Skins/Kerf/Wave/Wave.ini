[Rainmeter]
Update=33
@Include=#@#Menu.inc

[Metadata]
Name=Kerf - Wave
Information=Thin reactive waveform (AudioLevel, default output device).
Version=1.0

[Variables]
@Include=#@#Variables.inc
AlignMode=0
InkDivider=30
@Include2=#@#Styles.inc
@Include3=#@#Ink.inc

[mAudio]
Measure=Plugin
Plugin=AudioLevel
Port=Output
FFTSize=1024
FFTOverlap=512
FFTAttack=40
FFTDecay=250
Bands=24
FreqMin=40
FreqMax=12000
Sensitivity=#WaveSensitivity#

