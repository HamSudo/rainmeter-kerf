[Rainmeter]
Update=2000
@Include=#@#Menu.inc

[Metadata]
Name=Kerf - GPU
Information=GPU temperature from native Windows sensors (no extra software).
Version=1.1

[Variables]
@Include=#@#Variables.inc
@IncludeModules=#@#Modules.inc
Size=#GPUSize#
Trans=#GPUTrans#
Hover=#GPUHover#
Scale=(((#DisplayMode# = 0) ? #GPUAutoScale# : #BaseScale#)*#Size#/100)
AlignMode=#GPUAlign#
Kind=GPU
Label=GPU
RowW=([MeterLblRef:W] + 10*#Scale# + [MeterValRef:W])
@Include2=#@#Styles.inc
@Include3=#@#Ink.inc
@Include4=#@#Align.inc
@IncludeHover=#@#Hover.inc
@Include5=#@#TempData.inc
@Include6=#@#Temp.inc
