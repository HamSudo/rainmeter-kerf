[Rainmeter]
Update=33
@Include=#@#Menu.inc

[Metadata]
Name=Kerf - Clock (Vertical)
Information=Day / wave / hours / minutes / wave / date, stacked; day and date are letter-spaced to the width of the waves. Layout, alignment, format and visible parts: right-click > Customize Kerf.
Version=1.3

[Variables]
@Include=#@#Variables.inc
@IncludeModules=#@#Modules.inc
Size=#ClockSize#
Trans=#ClockTrans#
Hover=#ClockHover#
Scale=(#BaseScale#*#Size#/100)
AlignMode=#ClockAlign#
ShowTime=#ClockShowTime#
ShowSeconds=#ClockShowSeconds#
ShowWave=#ClockShowWave#
ShowDay=#ClockShowDay#
ShowDate=#ClockShowDate#
InkDivider=30
CapTop=0.22
Base=0.77
LineStep=0.63
WaveT=(#WaveHeight#*#Scale#)
SideW=(30*#Scale#)
BoxW=((#TimeSize#*1.6 + 30)*#Scale#)
DaySize=(#TimeSize#*0.24*#Scale#)
DateSize=(10.5*#Scale#)
@Include2=#@#Styles.inc
@Include3=#@#Ink.inc
@Include4=#@#Align.inc
@IncludeHover=#@#Hover.inc
@IncludeClock=#@#ClockMeasures.inc

[mColW]
Measure=Calc
Formula=Max([MeterHH:W], [MeterMM:W])
DynamicVariables=1

[mColX]
Measure=Calc
Formula=#AF# * (#BoxW# - #SideW# - mColW)
DynamicVariables=1

[mWaveLen]
Measure=Calc
Formula=mColW

[mWave]
Measure=Script
ScriptFile=#@#Scripts\Wave.lua
Meters=MeterWave1,MeterWave2
Orient=H

[mJustify]
Measure=Script
ScriptFile=#@#Scripts\Justify.lua
Targets=MeterDay|MeterDayRef|mDay|#DaySize#,MeterDMY|MeterDMYRef|mDMYShort|#DateSize#
Width=mColW

[MeterBox]
Meter=Image
MeterStyle=sHitBox
W=#BoxW#
H=((#ShowDate# = 1) ? ([MeterDMY:Y] + [MeterDMY:H]) : ((#ShowWave# = 1) ? ([MeterWave2:Y] + #WaveT#) : ((#ShowTime# = 1) ? ([MeterMM:Y] + [MeterMM:H]) : ([MeterDay:Y] + [MeterDay:H]))))

[MeterDayRef]
Meter=String
MeterStyle=sBase
MeasureName=mDay
FontFace=#DayFace#
FontSize=#DaySize#
StringStyle=[mDayStyle]
FontWeight=#DayWeight#
FontColor=0,0,0,0
InlineSetting=Shadow | 0 | 0 | 0 | 0,0,0,0
X=0
Y=0

[MeterDMYRef]
Meter=String
MeterStyle=sBase | sMono
MeasureName=mDMYShort
FontSize=#DateSize#
FontColor=0,0,0,0
InlineSetting=Shadow | 0 | 0 | 0 | 0,0,0,0
InlineSetting2=CharacterSpacing | 0 | 0 | 0
X=0
Y=0

[MeterDay]
Meter=String
MeterStyle=sBase
MeasureName=mDay
Hidden=(#ShowDay# = 0)
FontFace=#DayFace#
FontSize=#DaySize#
StringStyle=[mDayStyle]
InlineSetting=Shadow | 0 | 1 | 3 | #Halo#,(140*#FadeK#)
FontWeight=#DayWeight#
FontColor=#Ink#,(#A2#*#FadeK#)
X=([mColX:])
Y=0

[MeterWave1]
Meter=Shape
DynamicVariables=1
Hidden=(#ShowWave# = 0)
X=([mColX:])
Y=((#ShowDay# = 1) ? ([MeterDay:Y] + [MeterDay:H]*0.8) : 0)
PathMain=0,0 | LineTo 1,0
PathE1=0,0 | LineTo 1,0
PathE2=0,0 | LineTo 1,0
Shape=Rectangle 0,0,([mColW:]),(#WaveT#) | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Path PathE2 | StrokeWidth (#WaveStroke#*0.75*#Scale#) | Stroke Color #Ink#,(#WaveEcho2#*#FadeK#) | Fill Color 0,0,0,0 | StrokeLineJoin Round
Shape3=Path PathE1 | StrokeWidth (#WaveStroke#*0.75*#Scale#) | Stroke Color #Ink#,(#WaveEcho1#*#FadeK#) | Fill Color 0,0,0,0 | StrokeLineJoin Round
Shape4=Path PathMain | StrokeWidth (#WaveStroke#*#Scale#) | Stroke Color #Ink#,(215*#FadeK#) | Fill Color 0,0,0,0 | StrokeLineJoin Round | StrokeStartCap Round | StrokeEndCap Round

[MeterHH]
Meter=String
MeterStyle=sBase
MeasureName=mHour
Hidden=(#ShowTime# = 0)
FontSize=(#TimeSize#*#Scale#)
FontWeight=#TimeWeight#
InlineSetting2=CharacterSpacing | 0 | #TimeTracking# | 0
X=([mColX:] + #AF# * ([mColW:] - [MeterHH:W]))
Y=(Max(0, ((#ShowWave# = 1) ? ([MeterWave1:Y] + #WaveT# + 6*#Scale#) : ((#ShowDay# = 1) ? ([MeterDay:Y] + [MeterDay:H] + 4*#Scale#) : 0)) - [MeterHH:H]*#CapTop#))

[MeterMM]
Meter=String
MeterStyle=sBase
MeasureName=mMinute
Hidden=(#ShowTime# = 0)
FontSize=(#TimeSize#*#Scale#)
FontWeight=#TimeWeight#
InlineSetting2=CharacterSpacing | 0 | #TimeTracking# | 0
X=([mColX:] + #AF# * ([mColW:] - [MeterMM:W]))
Y=([MeterHH:Y] + [MeterHH:H]*#LineStep#)

[MeterSec]
Meter=String
MeterStyle=sBase | sMono
MeasureName=mSec
Hidden=((#ShowTime# * #ShowSeconds#) = 0)
FontSize=(11*#Scale#)
FontColor=#Ink#,(#A2#*#FadeK#)
X=([MeterMM:X] + [MeterMM:W] + 6*#Scale#)
Y=([MeterMM:Y] + [MeterMM:H]*#Base# - [MeterSec:H]*0.8)

[MeterWave2]
Meter=Shape
DynamicVariables=1
Hidden=(#ShowWave# = 0)
X=([mColX:])
Y=((#ShowTime# = 1) ? ([MeterMM:Y] + [MeterMM:H]*#Base# + 6*#Scale#) : ([MeterHH:Y] + [MeterHH:H]*#CapTop#))
PathMain=0,0 | LineTo 1,0
PathE1=0,0 | LineTo 1,0
PathE2=0,0 | LineTo 1,0
Shape=Rectangle 0,0,([mColW:]),(#WaveT#) | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Path PathE2 | StrokeWidth (#WaveStroke#*0.75*#Scale#) | Stroke Color #Ink#,(#WaveEcho2#*#FadeK#) | Fill Color 0,0,0,0 | StrokeLineJoin Round
Shape3=Path PathE1 | StrokeWidth (#WaveStroke#*0.75*#Scale#) | Stroke Color #Ink#,(#WaveEcho1#*#FadeK#) | Fill Color 0,0,0,0 | StrokeLineJoin Round
Shape4=Path PathMain | StrokeWidth (#WaveStroke#*#Scale#) | Stroke Color #Ink#,(215*#FadeK#) | Fill Color 0,0,0,0 | StrokeLineJoin Round | StrokeStartCap Round | StrokeEndCap Round

[MeterDMY]
Meter=String
MeterStyle=sBase | sMono
MeasureName=mDMYShort
Hidden=(#ShowDate# = 0)
FontSize=#DateSize#
FontColor=#Ink#,(#A2#*#FadeK#)
InlineSetting3=Color | #AccInk#,(255*#FadeK#)
InlinePattern3=/
X=([mColX:])
Y=((#ShowWave# = 1) ? ([MeterWave2:Y] + #WaveT# + 2*#Scale#) : ((#ShowTime# = 1) ? ([MeterMM:Y] + [MeterMM:H]*#Base# + 6*#Scale#) : ([MeterHH:Y] + [MeterHH:H]*#CapTop#)))
