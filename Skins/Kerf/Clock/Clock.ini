[Rainmeter]
Update=33
@Include=#@#Menu.inc
ContextTitle9=Show / hide time
ContextAction9=[!WriteKeyValue Variables ShowTime (1-#ShowTime#)][!Refresh]
ContextTitle10=Show / hide seconds + format
ContextAction10=[!WriteKeyValue Variables ShowSeconds (1-#ShowSeconds#)][!Refresh]
ContextTitle11=Show / hide wave
ContextAction11=[!WriteKeyValue Variables ShowWave (1-#ShowWave#)][!Refresh]
ContextTitle12=Show / hide day
ContextAction12=[!WriteKeyValue Variables ShowDay (1-#ShowDay#)][!Refresh]
ContextTitle13=Show / hide date
ContextAction13=[!WriteKeyValue Variables ShowDate (1-#ShowDate#)][!Refresh]

[Metadata]
Name=Kerf - Clock
Information=Time, waveform, day and date as one movable unit. Right-click to align or show/hide any part.
Version=1.1

[Variables]
@Include=#@#Variables.inc
AlignMode=0
ShowTime=1
ShowSeconds=1
ShowWave=1
ShowDay=1
ShowDate=1
InkDivider=30
BoxW=(#TimeSize#*3.3*#Scale#)
Gap=(10*#Scale#)
Baseline=0.78
@Include2=#@#Styles.inc
@Include3=#@#Ink.inc
@Include4=#@#Align.inc

[mTime]
Measure=Time
Format=#TimeFormat#
UpdateDivider=30

[mSec]
Measure=Time
Format=%S
UpdateDivider=15

[mTag]
Measure=Time
Format=#TagFormat#
UpdateDivider=30

[mDay]
Measure=Time
Format=%A
UpdateDivider=30

[mDMY]
Measure=Time
Format=%d / %m / %Y
UpdateDivider=30

[mDayStyle]
Measure=String
String=#DayItalic#
RegExpSubstitute=1
Substitute="^1$":"Italic","^0$":"Normal"
UpdateDivider=-1

[mDaySize]
Measure=Calc
Formula=(#TimeSize#*#DayScale#*#Scale#)
UpdateDivider=-1

[mAudio]
Measure=Plugin
Plugin=AudioLevel
Port=Output
RMSAttack=40
RMSDecay=300
RMSGain=#WaveGain#

[mLevel]
Measure=Plugin
Plugin=AudioLevel
Parent=mAudio
Type=RMS
Channel=Avg

[mVolume]
Measure=Plugin
Plugin=Win7AudioPlugin
UpdateDivider=15

[mWave]
Measure=Script
ScriptFile=#@#Scripts\Wave.lua

[MeterBox]
MeterStyle=sHitBox
W=#BoxW#
H=(((#ShowDay# + #ShowDate#) > 0) ? ([MeterDay:Y] + [MeterDay:H]) : ((#ShowWave# = 1) ? ([MeterWave:Y] + #WaveHeight#*#Scale#) : ([MeterTime:Y] + [MeterTime:H])))

[MeterTime]
Meter=String
MeterStyle=sBase
MeasureName=mTime
Hidden=(#ShowTime# = 0)
FontSize=(#TimeSize#*#Scale#)
FontWeight=#TimeWeight#
InlineSetting2=CharacterSpacing | 0 | #TimeTracking# | 0
InlineSetting3=Color | #Ink#,107
InlinePattern3=:
X=(#AF# * (#BoxW# - [MeterTime:W]))
Y=0

[MeterSec]
Meter=String
MeterStyle=sBase | sMono
MeasureName=mSec
Hidden=((#ShowTime# * #ShowSeconds#) = 0)
FontSize=(11*#Scale#)
FontColor=#Ink#,#A2#
X=((#AF# = 1) ? ([MeterTime:X] - #Gap# - [MeterSec:W]) : ([MeterTime:X] + [MeterTime:W] + #Gap#))
Y=([MeterTime:Y] + #TimeSize#*0.34*#Scale#)

[MeterTag]
Meter=String
MeterStyle=sBase | sMono
MeasureName=mTag
Hidden=((#ShowTime# * #ShowSeconds#) = 0)
FontSize=(9*#Scale#)
FontColor=#Ink#,#A3#
X=((#AF# = 1) ? ([MeterTime:X] - #Gap# - [MeterTag:W]) : ([MeterTime:X] + [MeterTime:W] + #Gap#))
Y=([MeterSec:Y] + [MeterSec:H] + 4*#Scale#)

[MeterWave]
Meter=Shape
DynamicVariables=1
Hidden=(#ShowWave# = 0)
X=([MeterTime:X])
Y=((#ShowTime# = 1) ? ([MeterTime:Y] + [MeterTime:H]*#Baseline#) : 0)
PathMain=0,0 | LineTo 1,0
PathE1=0,0 | LineTo 1,0
PathE2=0,0 | LineTo 1,0
Shape=Rectangle 0,0,([MeterTime:W]),(#WaveHeight#*#Scale#) | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Path PathE2 | StrokeWidth (#WaveStroke#*0.75*#Scale#) | Stroke Color #Ink#,#WaveEcho2# | Fill Color 0,0,0,0 | StrokeLineJoin Round
Shape3=Path PathE1 | StrokeWidth (#WaveStroke#*0.75*#Scale#) | Stroke Color #Ink#,#WaveEcho1# | Fill Color 0,0,0,0 | StrokeLineJoin Round
Shape4=Path PathMain | StrokeWidth (#WaveStroke#*#Scale#) | Stroke Color #Ink#,215 | Fill Color 0,0,0,0 | StrokeLineJoin Round | StrokeStartCap Round | StrokeEndCap Round

[MeterDay]
Meter=String
MeterStyle=sBase
MeasureName=mDay
Hidden=(#ShowDay# = 0)
FontFace=#DayFace#
FontSize=(#TimeSize#*#DayScale#*#Scale#)
StringStyle=[mDayStyle]
InlineSetting=Shadow | 0 | 1 | 3 | #Halo#,140
FontWeight=#DayWeight#
FontColor=#Ink#,#A2#
X=([MeterTime:X])
Y=((#ShowWave# = 1) ? ([MeterWave:Y] + #WaveHeight#*#Scale#/2 + 7*#Scale#) : ((#ShowTime# = 1) ? ([MeterTime:Y] + [MeterTime:H]*#Baseline# + 4*#Scale#) : 0))

[MeterDMY]
Meter=String
MeterStyle=sBase | sMono
MeasureName=mDMY
Hidden=(#ShowDate# = 0)
Text=" %1"
InlineSetting4=Face | #DayFace#
InlinePattern4=^\s
InlineSetting5=Size | [mDaySize:]
InlinePattern5=^\s
FontSize=(10.5*#Scale#)
FontColor=#Ink#,#A2#
InlineSetting3=Color | #AccInk#,255
InlinePattern3=/
X=([MeterTime:X] + [MeterTime:W] - [MeterDMY:W])
Y=([MeterDay:Y])
