[Rainmeter]
Update=1000
@Include=#@#Menu.inc
ContextTitle10=Stack wave + date under this clock
ContextAction10=[!CommandMeasure mStack "Stack()"]
ContextTitle11=Unstack date (natural width)
ContextAction11=[!CommandMeasure mStack "Unstack()"]

[Metadata]
Name=Kerf - Clock
Information=Primary time display. Drag anywhere; alignment follows screen position.
Version=1.0

[Variables]
@Include=#@#Variables.inc
AlignMode=0
BoxW=(#TimeSize#*3.3*#Scale#)
Gap=(10*#Scale#)
@Include2=#@#Styles.inc
@Include3=#@#Ink.inc
@Include4=#@#Align.inc

[mStack]
Measure=Script
ScriptFile=#@#Scripts\Stack.lua
Baseline=0.74

[mTime]
Measure=Time
Format=#TimeFormat#

[mSec]
Measure=Time
Format=%S

[mTag]
Measure=Time
Format=#TagFormat#

[mWeek]
Measure=Time
Format=W%V

[mDoy]
Measure=Time
Format=D%j

[mTZ]
Measure=Time
Format=%z
RegExpSubstitute=1
Substitute="^([+-])0?(\d+?)00$":"UTC\1\2","^([+-])0?(\d+)(\d\d)$":"UTC\1\2:\3"

[MeterBox]
MeterStyle=sHitBox
W=#BoxW#
H=([MeterTime:YH] + 4*#Scale#)

[MeterMeta]
Meter=String
MeterStyle=sBase | sMono
MeasureName=mWeek
MeasureName2=mDoy
MeasureName3=mTZ
Text=%1   %2   %3
FontColor=#Ink#,#A4#
X=(#AF# * (#BoxW# - [MeterMeta:W]))
Y=0

[MeterTime]
Meter=String
MeterStyle=sBase
MeasureName=mTime
FontSize=(#TimeSize#*#Scale#)
FontWeight=#TimeWeight#
InlineSetting2=CharacterSpacing | 0 | #TimeTracking# | 0
InlineSetting3=Color | #Ink#,107
InlinePattern3=:
X=(#AF# * (#BoxW# - [MeterTime:W]))
Y=(-#TimeSize#*0.12*#Scale#)R

[MeterSec]
Meter=String
MeterStyle=sBase | sMono
MeasureName=mSec
FontSize=(9*#Scale#)
FontColor=#Ink#,#A3#
X=((#AF# = 1) ? ([MeterTime:X] - #Gap# - [MeterSec:W]) : ([MeterTime:X] + [MeterTime:W] + #Gap#))
Y=([MeterTime:Y] + #TimeSize#*0.36*#Scale#)

[MeterTag]
Meter=String
MeterStyle=sBase | sMono
MeasureName=mTag
FontColor=#Ink#,#A4#
X=((#AF# = 1) ? ([MeterTime:X] - #Gap# - [MeterTag:W]) : ([MeterTime:X] + [MeterTime:W] + #Gap#))
Y=(4*#Scale#)R
