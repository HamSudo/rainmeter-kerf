[Rainmeter]
Update=33
@Include=#@#Menu.inc

[Metadata]
Name=Kerf - Clock (Horizontal)
Information=The vertical layout on its side: day | wave | hours minutes | wave | date. Day and date are written one character per line, spread to the height of the waves. Layout, alignment, format and visible parts: right-click > Customize Kerf.
Version=1.3

[Variables]
@Include=#@#Variables.inc
@IncludeModules=#@#Modules.inc
Size=#ClockSize#
Trans=#ClockTrans#
Hover=#ClockHover#
Scale=(#BaseScale#*#Size#/100)
AlignMode=#ClockAlign#
ShowTime=#ClockShowTime#
ShowSeconds=#ClockShowSeconds#
ShowWave=#ClockShowWave#
ShowDay=#ClockShowDay#
ShowDate=#ClockShowDate#
InkDivider=30
CapTop=0.22
Base=0.77
WaveT=(#WaveHeight#*#Scale#)
Pad=(8*#Scale#)
HMGap=(#TimeSize#*0.28*#Scale#)
DayStrip=(16*#Scale#)
DateStrip=(18*#Scale#)
@Include2=#@#Styles.inc
@Include3=#@#Ink.inc
@Include4=#@#Align.inc
@IncludeHover=#@#Hover.inc
@IncludeClock=#@#ClockMeasures.inc

[mWaveLen]
Measure=Calc
Formula=[MeterHH:H]*0.62
DynamicVariables=1

[mCY]
Measure=Calc
Formula=Max([MeterHH:H]*0.495, mWaveLen/2) + 2*#Scale#
DynamicVariables=1

[mXWave1]
Measure=Calc
Formula=#ShowDay# * (#DayStrip# + 4*#Scale#)

[mXTime]
Measure=Calc
Formula=mXWave1 + #ShowWave# * (#WaveT# + #Pad#)

[mXMM]
Measure=Calc
Formula=mXTime + #ShowTime# * ([MeterHH:W] + #HMGap#)
DynamicVariables=1

[mXAfter]
Measure=Calc
Formula=mXMM + #ShowTime# * ([MeterMM:W] + #ShowSeconds# * (6*#Scale# + Max([MeterTag:W], [MeterSec:W])))
DynamicVariables=1

[mXWave2]
Measure=Calc
Formula=mXAfter + #ShowWave# * #Pad#

[mXDate]
Measure=Calc
Formula=mXWave2 + #ShowWave# * (#WaveT# + 4*#Scale#)

[mWave]
Measure=Script
ScriptFile=#@#Scripts\Wave.lua
Meters=MeterWave1,MeterWave2
Orient=V

[mDayStack]
Measure=Script
ScriptFile=#@#Scripts\Stack.lua
Mode=letters
SourceMeasure=mDay
Upper=1
Prefix=MeterD
Count=9
ShowVar=ShowDay
MaxSize=(12*#Scale#)
LengthMeasure=mWaveLen
CenterYMeasure=mCY

[mDateStack]
Measure=Script
ScriptFile=#@#Scripts\Stack.lua
Mode=date
Prefix=MeterY
Count=5
ShowVar=ShowDate
MaxSize=(11*#Scale#)
LengthMeasure=mWaveLen
CenterYMeasure=mCY

[MeterBox]
Meter=Image
MeterStyle=sHitBox
W=([mXDate:] + #ShowDate# * #DateStrip#)
H=(2*[mCY:])

[sDayLetter]
FontFace=#DayFace#
FontWeight=#DayWeight#
FontColor=#Ink#,(#A2#*#FadeK#)
InlineSetting=Shadow | 0 | 1 | 3 | #Halo#,(140*#FadeK#)
StringAlign=Center
X=(#DayStrip#/2)
Hidden=1

[MeterD1]
Meter=String
MeterStyle=sBase | sDayLetter
[MeterD2]
Meter=String
MeterStyle=sBase | sDayLetter
[MeterD3]
Meter=String
MeterStyle=sBase | sDayLetter
[MeterD4]
Meter=String
MeterStyle=sBase | sDayLetter
[MeterD5]
Meter=String
MeterStyle=sBase | sDayLetter
[MeterD6]
Meter=String
MeterStyle=sBase | sDayLetter
[MeterD7]
Meter=String
MeterStyle=sBase | sDayLetter
[MeterD8]
Meter=String
MeterStyle=sBase | sDayLetter
[MeterD9]
Meter=String
MeterStyle=sBase | sDayLetter

[MeterWave1]
Meter=Shape
DynamicVariables=1
Hidden=(#ShowWave# = 0)
X=([mXWave1:])
Y=([mCY:] - [mWaveLen:]/2)
PathMain=0,0 | LineTo 0,1
PathE1=0,0 | LineTo 0,1
PathE2=0,0 | LineTo 0,1
Shape=Rectangle 0,0,(#WaveT#),([mWaveLen:]) | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Path PathE2 | StrokeWidth (#WaveStroke#*0.75*#Scale#) | Stroke Color #Ink#,(#WaveEcho2#*#FadeK#) | Fill Color 0,0,0,0 | StrokeLineJoin Round
Shape3=Path PathE1 | StrokeWidth (#WaveStroke#*0.75*#Scale#) | Stroke Color #Ink#,(#WaveEcho1#*#FadeK#) | Fill Color 0,0,0,0 | StrokeLineJoin Round
Shape4=Path PathMain | StrokeWidth (#WaveStroke#*#Scale#) | Stroke Color #Ink#,(215*#FadeK#) | Fill Color 0,0,0,0 | StrokeLineJoin Round | StrokeStartCap Round | StrokeEndCap Round

[MeterHH]
Meter=String
MeterStyle=sBase
MeasureName=mHour
Hidden=(#ShowTime# = 0)
FontSize=(#TimeSize#*#Scale#)
FontWeight=#TimeWeight#
InlineSetting2=CharacterSpacing | 0 | #TimeTracking# | 0
X=([mXTime:])
Y=([mCY:] - [MeterHH:H]*0.495)

[MeterMM]
Meter=String
MeterStyle=sBase
MeasureName=mMinute
Hidden=(#ShowTime# = 0)
FontSize=(#TimeSize#*#Scale#)
FontWeight=#TimeWeight#
InlineSetting2=CharacterSpacing | 0 | #TimeTracking# | 0
X=([mXMM:])
Y=([MeterHH:Y])

[MeterTag]
Meter=String
MeterStyle=sBase | sMono
MeasureName=mTag
Hidden=((#ShowTime# * #ShowSeconds#) = 0)
FontSize=(9*#Scale#)
FontColor=#Ink#,(#A3#*#FadeK#)
X=([MeterMM:X] + [MeterMM:W] + 6*#Scale#)
Y=([MeterMM:Y] + [MeterMM:H]*#CapTop# - [MeterTag:H]*0.18)

[MeterSec]
Meter=String
MeterStyle=sBase | sMono
MeasureName=mSec
Hidden=((#ShowTime# * #ShowSeconds#) = 0)
FontSize=(11*#Scale#)
FontColor=#Ink#,(#A2#*#FadeK#)
X=([MeterMM:X] + [MeterMM:W] + 6*#Scale#)
Y=([MeterMM:Y] + [MeterMM:H]*#Base# - [MeterSec:H]*0.8)

[MeterWave2]
Meter=Shape
DynamicVariables=1
Hidden=(#ShowWave# = 0)
X=([mXWave2:])
Y=([mCY:] - [mWaveLen:]/2)
PathMain=0,0 | LineTo 0,1
PathE1=0,0 | LineTo 0,1
PathE2=0,0 | LineTo 0,1
Shape=Rectangle 0,0,(#WaveT#),([mWaveLen:]) | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Path PathE2 | StrokeWidth (#WaveStroke#*0.75*#Scale#) | Stroke Color #Ink#,(#WaveEcho2#*#FadeK#) | Fill Color 0,0,0,0 | StrokeLineJoin Round
Shape3=Path PathE1 | StrokeWidth (#WaveStroke#*0.75*#Scale#) | Stroke Color #Ink#,(#WaveEcho1#*#FadeK#) | Fill Color 0,0,0,0 | StrokeLineJoin Round
Shape4=Path PathMain | StrokeWidth (#WaveStroke#*#Scale#) | Stroke Color #Ink#,(215*#FadeK#) | Fill Color 0,0,0,0 | StrokeLineJoin Round | StrokeStartCap Round | StrokeEndCap Round

[sDateLine]
StringAlign=Center
X=([mXDate:] + #DateStrip#/2)
Hidden=1

[MeterY1]
Meter=String
MeterStyle=sBase | sMono | sDateLine
FontColor=#Ink#,(#A2#*#FadeK#)
[MeterY2]
Meter=String
MeterStyle=sBase | sMono | sDateLine
Text=–
FontColor=#AccInk#,(255*#FadeK#)
[MeterY3]
Meter=String
MeterStyle=sBase | sMono | sDateLine
FontColor=#Ink#,(#A2#*#FadeK#)
[MeterY4]
Meter=String
MeterStyle=sBase | sMono | sDateLine
Text=–
FontColor=#AccInk#,(255*#FadeK#)
[MeterY5]
Meter=String
MeterStyle=sBase | sMono | sDateLine
FontColor=#Ink#,(#A2#*#FadeK#)
