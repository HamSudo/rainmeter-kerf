[Rainmeter]
Update=33
@Include=#@#Menu.inc

[Metadata]
Name=Kerf - Clock (Horizontal)
Information=The vertical layout turned on its side: day | wave | hours minutes | wave | date, with the day, date and waves rotated. Layout, alignment and visible parts: right-click > Customize Kerf.
Version=1.2

[Variables]
@Include=#@#Variables.inc
@IncludeModules=#@#Modules.inc
Size=#ClockSize#
Trans=#ClockTrans#
Hover=#ClockHover#
Scale=(#BaseScale#*#Size#/100)
AlignMode=#ClockAlign#
ShowTime=#ClockShowTime#
ShowSeconds=#ClockShowSeconds#
ShowWave=#ClockShowWave#
ShowDay=#ClockShowDay#
ShowDate=#ClockShowDate#
InkDivider=30
CapTop=0.22
Base=0.77
Turn=-1.5708
WaveT=(#WaveHeight#*#Scale#)
Pad=(8*#Scale#)
HMGap=(#TimeSize#*0.28*#Scale#)
@Include2=#@#Styles.inc
@Include3=#@#Ink.inc
@Include4=#@#Align.inc
@IncludeHover=#@#Hover.inc
@IncludeClock=#@#ClockMeasures.inc

[mCY]
Measure=Calc
Formula=Max(Max([MeterHH:H]*0.495, [mWaveLen:]*#ShowWave#/2), Max([MeterDayRef:W]*#ShowDay#, [MeterDMYRef:W]*#ShowDate#)/2) + 2*#Scale#
DynamicVariables=1

[mWaveLen]
Measure=Calc
Formula=[MeterHH:H]*0.62
DynamicVariables=1

[mDateSize]
Measure=Calc
Formula=Clamp(mDateSize + (mDateSize * mWaveLen / Max(1, [MeterDMYRef:W]) - mDateSize) * 0.5, 5*#Scale#, 10.5*#Scale#)
DynamicVariables=1

[mXWave1]
Measure=Calc
Formula=#ShowDay# * ([MeterDayRef:H] + 4*#Scale#)
DynamicVariables=1

[mXTime]
Measure=Calc
Formula=mXWave1 + #ShowWave# * (#WaveT# + #Pad#)
DynamicVariables=1

[mXMM]
Measure=Calc
Formula=mXTime + #ShowTime# * ([MeterHH:W] + #HMGap#)
DynamicVariables=1

[mXAfter]
Measure=Calc
Formula=mXMM + #ShowTime# * ([MeterMM:W] + #ShowSeconds# * (6*#Scale# + Max([MeterTag:W], [MeterSec:W])))
DynamicVariables=1

[mXWave2]
Measure=Calc
Formula=mXAfter + #ShowWave# * #Pad#
DynamicVariables=1

[mXDate]
Measure=Calc
Formula=mXWave2 + #ShowWave# * (#WaveT# + 4*#Scale#)
DynamicVariables=1

[mDMYCompact]
Measure=Time
Format=%d/%m/%Y
UpdateDivider=30

[mWave]
Measure=Script
ScriptFile=#@#Scripts\Wave.lua
Meters=MeterWave1,MeterWave2
Orient=V

[MeterBox]
Meter=Image
MeterStyle=sHitBox
W=([mXDate:] + #ShowDate# * [MeterDMYRef:H])
H=(2*[mCY:])

[MeterDayRef]
Meter=String
MeterStyle=sBase
MeasureName=mDay
FontFace=#DayFace#
FontSize=(#TimeSize#*#DayScale#*#Scale#)
StringStyle=[mDayStyle]
FontWeight=#DayWeight#
FontColor=0,0,0,0
InlineSetting=Shadow | 0 | 0 | 0 | 0,0,0,0
X=0
Y=0

[MeterDMYRef]
Meter=String
MeterStyle=sBase | sMono
MeasureName=mDMYCompact
FontSize=([mDateSize:])
InlineSetting2=CharacterSpacing | 0 | 0.5 | 0
FontColor=0,0,0,0
InlineSetting=Shadow | 0 | 0 | 0 | 0,0,0,0
X=0
Y=0

[MeterDay]
Meter=String
MeterStyle=sBase
MeasureName=mDay
Hidden=(#ShowDay# = 0)
FontFace=#DayFace#
FontSize=(#TimeSize#*#DayScale#*#Scale#)
StringStyle=[mDayStyle]
InlineSetting=Shadow | 0 | 1 | 3 | #Halo#,(140*#FadeK#)
FontWeight=#DayWeight#
FontColor=#Ink#,(#A2#*#FadeK#)
Angle=#Turn#
StringAlign=CenterCenter
W=([MeterDayRef:H])
X=([MeterDayRef:H]/2)
Y=([mCY:])

[MeterWave1]
Meter=Shape
DynamicVariables=1
Hidden=(#ShowWave# = 0)
X=([mXWave1:])
Y=([mCY:] - [mWaveLen:]/2)
PathMain=0,0 | LineTo 0,1
PathE1=0,0 | LineTo 0,1
PathE2=0,0 | LineTo 0,1
Shape=Rectangle 0,0,(#WaveT#),([mWaveLen:]) | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Path PathE2 | StrokeWidth (#WaveStroke#*0.75*#Scale#) | Stroke Color #Ink#,(#WaveEcho2#*#FadeK#) | Fill Color 0,0,0,0 | StrokeLineJoin Round
Shape3=Path PathE1 | StrokeWidth (#WaveStroke#*0.75*#Scale#) | Stroke Color #Ink#,(#WaveEcho1#*#FadeK#) | Fill Color 0,0,0,0 | StrokeLineJoin Round
Shape4=Path PathMain | StrokeWidth (#WaveStroke#*#Scale#) | Stroke Color #Ink#,(215*#FadeK#) | Fill Color 0,0,0,0 | StrokeLineJoin Round | StrokeStartCap Round | StrokeEndCap Round

[MeterHH]
Meter=String
MeterStyle=sBase
MeasureName=mHour
Hidden=(#ShowTime# = 0)
FontSize=(#TimeSize#*#Scale#)
FontWeight=#TimeWeight#
InlineSetting2=CharacterSpacing | 0 | #TimeTracking# | 0
X=([mXTime:])
Y=([mCY:] - [MeterHH:H]*0.495)

[MeterMM]
Meter=String
MeterStyle=sBase
MeasureName=mMinute
Hidden=(#ShowTime# = 0)
FontSize=(#TimeSize#*#Scale#)
FontWeight=#TimeWeight#
InlineSetting2=CharacterSpacing | 0 | #TimeTracking# | 0
X=([mXMM:])
Y=([MeterHH:Y])

[MeterTag]
Meter=String
MeterStyle=sBase | sMono
MeasureName=mTag
Hidden=((#ShowTime# * #ShowSeconds#) = 0)
FontSize=(9*#Scale#)
FontColor=#Ink#,(#A3#*#FadeK#)
X=([MeterMM:X] + [MeterMM:W] + 6*#Scale#)
Y=([MeterMM:Y] + [MeterMM:H]*#CapTop# - [MeterTag:H]*0.18)

[MeterSec]
Meter=String
MeterStyle=sBase | sMono
MeasureName=mSec
Hidden=((#ShowTime# * #ShowSeconds#) = 0)
FontSize=(11*#Scale#)
FontColor=#Ink#,(#A2#*#FadeK#)
X=([MeterMM:X] + [MeterMM:W] + 6*#Scale#)
Y=([MeterMM:Y] + [MeterMM:H]*#Base# - [MeterSec:H]*0.8)

[MeterWave2]
Meter=Shape
DynamicVariables=1
Hidden=(#ShowWave# = 0)
X=([mXWave2:])
Y=([mCY:] - [mWaveLen:]/2)
PathMain=0,0 | LineTo 0,1
PathE1=0,0 | LineTo 0,1
PathE2=0,0 | LineTo 0,1
Shape=Rectangle 0,0,(#WaveT#),([mWaveLen:]) | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Path PathE2 | StrokeWidth (#WaveStroke#*0.75*#Scale#) | Stroke Color #Ink#,(#WaveEcho2#*#FadeK#) | Fill Color 0,0,0,0 | StrokeLineJoin Round
Shape3=Path PathE1 | StrokeWidth (#WaveStroke#*0.75*#Scale#) | Stroke Color #Ink#,(#WaveEcho1#*#FadeK#) | Fill Color 0,0,0,0 | StrokeLineJoin Round
Shape4=Path PathMain | StrokeWidth (#WaveStroke#*#Scale#) | Stroke Color #Ink#,(215*#FadeK#) | Fill Color 0,0,0,0 | StrokeLineJoin Round | StrokeStartCap Round | StrokeEndCap Round

[MeterDMY]
Meter=String
MeterStyle=sBase | sMono
MeasureName=mDMYCompact
Hidden=(#ShowDate# = 0)
FontSize=([mDateSize:])
InlineSetting2=CharacterSpacing | 0 | 0.5 | 0
FontColor=#Ink#,(#A2#*#FadeK#)
InlineSetting3=Color | #AccInk#,(255*#FadeK#)
InlinePattern3=/
Angle=#Turn#
StringAlign=CenterCenter
W=([MeterDMYRef:H])
X=([mXDate:] + [MeterDMYRef:H]/2)
Y=([mCY:])
