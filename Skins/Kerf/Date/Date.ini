[Rainmeter]
Update=1000
@Include=#@#Menu.inc

[Metadata]
Name=Kerf - Date
Information=Day and date. Same box width as the clock so the two align when stacked.
Version=1.0

[Variables]
@Include=#@#Variables.inc
AlignMode=0
BoxW=(#TimeSize#*3.3*#Scale#)
Gap=(16*#Scale#)
@Include2=#@#Styles.inc
@Include3=#@#Ink.inc
@Include4=#@#Align.inc

[mDay]
Measure=Time
Format=%A

[mDMY]
Measure=Time
Format=%d / %m / %Y

[mDayStyle]
Measure=String
String=#DayItalic#
RegExpSubstitute=1
Substitute="^1$":"Italic","^0$":"Normal"

[mDaySize]
Measure=Calc
Formula=(#TimeSize#*#DayScale#*#Scale#)

[MeterBox]
MeterStyle=sHitBox
W=((#DateRowW# > 0) ? (#DateRowW#*#Scale#) : #BoxW#)
H=([MeterDay:YH] + 2*#Scale#)

[MeterDay]
Meter=String
MeterStyle=sBase
MeasureName=mDay
FontFace=#DayFace#
FontSize=(#TimeSize#*#DayScale#*#Scale#)
StringStyle=[mDayStyle]
FontWeight=#DayWeight#
FontColor=#Ink#,#A2#
X=((#DateRowW# > 0) ? 0 : ((#AF# = 1) ? (#BoxW# - [MeterDay:W]) : (#AF# * (#BoxW# - [MeterDay:W] - #Gap# - [MeterDMY:W]))))
Y=0

[MeterDMY]
Meter=String
MeterStyle=sBase | sMono
MeasureName=mDMY
Text=" %1"
InlineSetting4=Face | #DayFace#
InlinePattern4=^\s
InlineSetting5=Size | [mDaySize:]
InlinePattern5=^\s
FontSize=(9*#Scale#)
InlineSetting3=Color | #AccInk#,255
InlinePattern3=/
X=((#DateRowW# > 0) ? (#DateRowW#*#Scale# - [MeterDMY:W]) : ((#AF# = 1) ? (#BoxW# - [MeterDay:W] - #Gap# - [MeterDMY:W]) : ([MeterDay:X] + [MeterDay:W] + #Gap#)))
Y=([MeterDay:Y])
