[Rainmeter]
Update=1000
@Include=#@#Menu.inc

[Metadata]
Name=Kerf - Date
Information=Day and date. Same box width as the clock so the two align when stacked.
Version=1.0

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Styles.inc
@Include3=#@#Ink.inc
@Include4=#@#Align.inc
AlignMode=0
BoxW=(#TimeSize#*3.3*#Scale#)
Gap=(16*#Scale#)

[mDay]
Measure=Time
Format=%A

[mDMY]
Measure=Time
Format=%d / %m / %Y

[MeterBox]
MeterStyle=sHitBox
W=#BoxW#
H=([MeterDay:YH] + 2*#Scale#)

[MeterDay]
Meter=String
MeterStyle=sBase
MeasureName=mDay
FontSize=(#TimeSize#*0.25*#Scale#)
FontWeight=#DayWeight#
FontColor=#Ink#,#A2#
X=((#AF# = 1) ? (#BoxW# - [MeterDay:W]) : (#AF# * (#BoxW# - [MeterDay:W] - #Gap# - [MeterDMY:W])))
Y=0

[MeterDMY]
Meter=String
MeterStyle=sBase | sMono
MeasureName=mDMY
FontSize=(9*#Scale#)
InlineSetting3=Color | #AccInk#,255
InlinePattern3=/
X=((#AF# = 1) ? (#BoxW# - [MeterDay:W] - #Gap# - [MeterDMY:W]) : ([MeterDay:X] + [MeterDay:W] + #Gap#))
Y=([MeterDay:Y] + [MeterDay:H] - [MeterDMY:H] - 3*#Scale#)
